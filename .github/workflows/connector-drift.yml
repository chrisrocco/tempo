# The nightly drift monitor: certify every live-testable connector against the
# real service it wraps. A red run here means the service moved (schema drift,
# a broken idempotency story, a disordered event feed) — the alarm fires in
# this workflow instead of inside somebody's workflow execution.
#
# Configuration (repository settings):
#   secret CONNECTOR_FIXTURE_TOKEN — a GitHub token with repo scope on the
#     fixture repository (NOT the workflow's own GITHUB_TOKEN, which is
#     reserved by Actions and scoped to this repo).
#   variable CONNECTOR_FIXTURE_REPO — `owner/repo` of a repository that exists
#     only to hold connector test fixtures. See
#     src/connectors/examples/github/README.md.
#
# Until both are set, the run reports "not configured" and exits green, so
# enabling this file is safe before the credentials exist.

name: connector drift

on:
  schedule:
    - cron: '17 6 * * *' # nightly; an offbeat minute to dodge the top-of-hour crowd
  workflow_dispatch: {}

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: certify connectors against live services
        env:
          GITHUB_TOKEN: ${{ secrets.CONNECTOR_FIXTURE_TOKEN }}
          GITHUB_FIXTURE_REPO: ${{ vars.CONNECTOR_FIXTURE_REPO }}
        run: |
          if [ -z "$GITHUB_TOKEN" ] || [ -z "$GITHUB_FIXTURE_REPO" ]; then
            echo "::notice::drift monitor not configured — set the CONNECTOR_FIXTURE_TOKEN secret and CONNECTOR_FIXTURE_REPO variable to arm it"
            exit 0
          fi
          npx tsx node_modules/jasmine/bin/jasmine.js \
            --config=spec/support/jasmine.json \
            --filter="github example"
