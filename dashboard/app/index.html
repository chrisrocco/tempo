<!doctype html>
<meta charset="utf-8" />
<title>tempo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  A classic script, not `type="module"` — a downstream build system consumes
  this shell and does not accept a module script.

  It is half of a pair: the bundle is built `--format=iife`
  (`dashboard/package.json`). esbuild's ESM output carries `import`/`export`
  statements whenever the entry exports something or a dependency is left
  external, and those are a syntax error in a classic script — the page dies
  before anything renders. This entry does neither today, so the two formats
  currently differ only by the wrapper; the pairing is what stops the first
  export from breaking the page silently. `tools/conventions.ts` checks that the
  two stay agreed, since neither file mentions the other and each looks correct
  on its own.

  `defer` restores the timing a module script had by default: run after parsing,
  so `<tempo-app>` below is already in the document when the custom elements are
  defined.
-->
<script defer src="/app.js"></script>
<style>
  /*
    The palettes, and the only place they are declared.

    On `:root` rather than on each component's `:host` — which is what makes them
    switchable. Custom properties inherit through shadow boundaries, but a value
    set directly on `:host` wins over an inherited one, so a palette declared per
    component cannot be overridden from outside. Declared once here, every shadow
    root inherits it and `theme_mode.ts` swaps the whole set by flipping one
    attribute.

    Adding a palette is this and one entry in `THEME_MODES` — no component
    changes, because every rule in `theme.ts` names a role rather than a colour.
    Each block below overrides only what differs, so `--mono` is declared once on
    `:root` and inherited by the rest.

    In the three light palettes every colour that carries text clears 4.5:1
    against the surface it sits on — `--dim` (the lightest, and what table
    headers use) against `--panel`, and each role against its own `--*-bg`,
    since the status pills are 11px and so count as normal text rather than
    large. Several of these ended up a point or two darker than they started for
    exactly that reason, and both are worth re-checking when a palette is added.

    Dark is the palette this app shipped with, kept as it was. Its `--dim` is
    3.64:1 against `--panel` and is the one known exception; lightening it to
    about #7c8494 would clear the bar, which is a change to make deliberately
    rather than as a side effect of adding themes.
  */
  :root {
    --bg: #f4f5fb;
    --panel: #ffffff;
    --border: #dfe2ef;
    --border-soft: #ecedf6;
    --text: #1a1e30;
    --muted: #5c6382;
    --dim: #6e7594;
    --accent: #4a54c4;
    --accent-bg: #e7e9fc;
    --ok: #0f7358;
    --ok-bg: #dcf2ea;
    --danger: #ab3252;
    --danger-bg: #fce7ed;
    --warn: #855c11;
    --warn-bg: #faefda;
    --neutral: #5c6382;
    --neutral-bg: #e9ebf5;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /*
    Sage. The accent is teal rather than green so that a link and a completed
    execution are not two shades of the same colour in one row — the whole risk
    of a green theme.
  */
  :root[data-theme='sage'] {
    --bg: #f2f6f0;
    --panel: #ffffff;
    --border: #dce6d7;
    --border-soft: #eaf1e7;
    --text: #1d2a20;
    --muted: #52655a;
    --dim: #687b6f;
    --accent: #2c6b62;
    --accent-bg: #d9ecea;
    --ok: #497820;
    --ok-bg: #e6f2d8;
    --danger: #a63a33;
    --danger-bg: #f9e4e1;
    --warn: #8a6410;
    --warn-bg: #f8eed4;
    --neutral: #52655a;
    --neutral-bg: #e7ede5;
  }

  /*
    Sunset. The accent is the dusty violet of the sky *above* a sunset, which
    keeps every warm colour free for meaning — an amber accent would sit right
    next to `--warn`, and the two appear together on any stuck execution.
  */
  :root[data-theme='sunset'] {
    --bg: #fdf5f0;
    --panel: #fffcfa;
    --border: #f0dfd4;
    --border-soft: #f8ece4;
    --text: #33212a;
    --muted: #7a5a63;
    --dim: #8c6d76;
    --accent: #795d9d;
    --accent-bg: #efe7f6;
    --ok: #4a754c;
    --ok-bg: #e4f0e2;
    --danger: #b23a4a;
    --danger-bg: #fbe4e6;
    --warn: #91640f;
    --warn-bg: #f9eed5;
    --neutral: #7a5a63;
    --neutral-bg: #f0e6e4;
  }

  :root[data-theme='dark'] {
    --bg: #0f1115;
    --panel: #151922;
    --border: #232733;
    --border-soft: #1a1e27;
    --text: #e6e6e6;
    --muted: #8b93a7;
    --dim: #6b7280;
    --accent: #7cc4ff;
    --accent-bg: #17324d;
    --ok: #6ee7a0;
    --ok-bg: #12331f;
    --danger: #ff9aa2;
    --danger-bg: #3d1a1d;
    --warn: #ffc46b;
    --warn-bg: #4a2f0a;
    --neutral: #b0b4bd;
    --neutral-bg: #2a2a2f;
  }

  body {
    margin: 0;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
</style>
<tempo-app></tempo-app>
